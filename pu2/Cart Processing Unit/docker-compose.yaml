services:
  # ─── Data Grid ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flash-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - flash_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Persistent Database ───────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: flash-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flashsale}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d:ro
    networks:
      - flash_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── PU2 – Cart Processing Unit ───────────────────────
  cart-pu2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flash-cart-pu2
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flash_net

# ─── Volumes (dữ liệu được lưu vĩnh viễn) ────────────────
volumes:
  redis_data:
    driver: local
  mariadb_data:
    driver: local

# ─── Network ─────────────────────────────────────────────
networks:
  flash_net:
    driver: bridge
