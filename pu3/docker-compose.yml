services:
  redis:
    image: redis:7-alpine
    container_name: pu3-redis
    ports:
      - "6383:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    image: node:20-alpine
    container_name: pu3-order-service
    working_dir: /app
    command: sh -c "npm ci && node src/app.js"
    volumes:
      - ./:/app
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8083:8083"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8083/orders/healthcheck', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
